name: CodeFactor

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  codefactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CodeFactor
        uses: codefactor-io/action@v1
        with:
          token: ${{ secrets.CODEFACTOR_TOKEN }}
