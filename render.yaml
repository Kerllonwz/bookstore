services:
  - type: web
    name: bookstore-ebac
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn bookstore.wsgi --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 0
      - key: DJANGO_ALLOWED_HOSTS
        value: bookstore-ebac.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString

databases:
  - name: bookstore-db
    plan: free
